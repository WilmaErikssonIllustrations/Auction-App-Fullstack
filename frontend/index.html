<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <main>
      <div id="left">
        <button id="displayFormButton">Ny Auktion</button>
        <form id="createAuctionForm">
          <label for="title">Rubrik</label>
          <input type="text" id="title" />
          <label for="image">Bild</label>
          <input type="file" id="image" accept="image/png, image/jpeg" />
          <label for="description">Beskrivning</label>
          <textarea id="description"></textarea>
          <label for="endDate">Dagar till auktionsslut</label>
          <input type="number" id="endDate" min="1" max="10" />
          <label for="startingBid">Utropspris</label>
          <input type="number" id="startingBid" />
          <button>Skapa</button>
        </form>
      </div>
      <div id="right"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
