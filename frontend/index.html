<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>

  <body>
    <header id="greeting"></header>
    <div id="userInfo" class="hide"></div>
    <main>
      <div id="left">
        <button id="displayFormButton">Ny auktion</button>
        <form id="createAuctionForm" class="hide">
          <h2>Skapa en auktion</h2>
          <label for="title">Rubrik</label>
          <input type="text" id="title" />
          <label for="image">Bild</label>
          <input type="file" id="image" accept="image/png, image/jpeg" />
          <label for="description">Beskrivning</label>
          <textarea id="description"></textarea>
          <label for="daysToEnd">Dagar till auktionsslut</label>
          <input type="number" id="daysToEnd" min="1" max="14" />
          <label for="startingBid">Utropspris</label>
          <input type="number" id="startingBid" />
          <button>Skapa</button>
        </form>
      </div>
      <div id="right">
        <h2>Auktioner</h2>
        <div id="auctionContainer"></div>
      </div>
    </main>
    <script type="module" src="/src/landingPage.ts"></script>
  </body>
</html>
